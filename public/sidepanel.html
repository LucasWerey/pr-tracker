<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PR Tracker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="panel">
    <header>
      <img src="icons/icon-32.png" alt="" width="28" height="28" />
      <div class="titles">
        <h1>Pull requests</h1>
        <span id="updated" class="muted"></span>
      </div>
      <button id="refresh" class="icon-btn" title="Refresh" aria-label="Refresh">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
      </button>
      <button id="settings" class="icon-btn" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="21" y1="4" x2="14" y2="4"/><line x1="10" y1="4" x2="3" y2="4"/><line x1="21" y1="12" x2="12" y2="12"/><line x1="8" y1="12" x2="3" y2="12"/><line x1="21" y1="20" x2="16" y2="20"/><line x1="12" y1="20" x2="3" y2="20"/><line x1="14" y1="2" x2="14" y2="6"/><line x1="8" y1="10" x2="8" y2="14"/><line x1="16" y1="18" x2="16" y2="22"/></svg>
      </button>
    </header>
    <div id="summary" class="summary"></div>
    <main id="content"></main>
    <script type="module" src="panel.js"></script>
  </body>
</html>
