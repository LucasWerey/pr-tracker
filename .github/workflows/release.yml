name: Release

# Push a tag like v0.1.0 to build the extension and attach a zip to a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Keep the manifest version in sync with the tag.
          jq --arg v "$VERSION" '.version = $v' dist/manifest.json > dist/manifest.tmp
          mv dist/manifest.tmp dist/manifest.json
          cd dist
          zip -r "../pr-tracker-${GITHUB_REF_NAME}.zip" . -x "*.map"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "pr-tracker-${GITHUB_REF_NAME}.zip" \
            --title "$GITHUB_REF_NAME" --generate-notes
